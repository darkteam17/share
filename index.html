<style>
:root{
  --accent:#00ffc3;
  --glow:#00ff88;
  --text:#e8f2f2;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  padding:20px;
  padding-top:85px; /* ĐẨY NỘI DUNG XUỐNG DƯỚI THANH BAR */
  min-height:100vh;
  overflow-x:hidden;
  background-image: url('https://sf-static.upanhlaylink.com/img/image_20251121040ff21b962a912d0f263f2fdeca9a3a.jpg');
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
}

/* TOP BAR */
#topBar{
  position: fixed;
  top:0; left:0;
  width:100%;
  height:60px;
  background: rgba(0,0,0,0.65);
  border-bottom:2px solid var(--accent);
  backdrop-filter: blur(6px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 18px;
  z-index:99999;
  box-shadow:0 3px 15px rgba(0,255,150,0.3);
}

#menuBtn{
  font-size:30px;
  color:var(--accent);
  padding:6px 12px;
  border-radius:8px;
  border:2px solid var(--accent);
  background:rgba(0,0,0,0.45);
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,200,.6);
}

#themeBtn{
  font-size:26px;
  color:var(--accent);
  padding:6px 12px;
  border-radius:8px;
  border:2px solid var(--accent);
  background:rgba(0,0,0,0.45);
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,200,.6);
}

/* SIDE MENU */
#sideMenu{
  position: fixed;
  top: 0;
  left: -260px;
  width: 260px;
  height: 100%;
  background: rgba(0,0,0,0.87);
  backdrop-filter: blur(8px);

  padding: 90px 22px 25px; /* ⬅ HOME không bị chèn bởi nút 3 gạch */

  z-index: 99998;
  transition: 0.35s ease;
  border-right: 2px solid var(--accent);
}

#sideMenu a{
  display:block;
  padding:16px;
  margin:18px 0;
  background:rgba(0,255,128,0.18);
  border-radius:10px;
  color:var(--accent);
  font-size:20px;
  font-weight:bold;
  text-decoration:none;
  transition:0.3s;
}

#sideMenu a:hover{
  background:rgba(0,255,128,0.35);
}

/* DARK/LIGHT MODE */
.light-mode{
  --accent:#0066ff;
  --glow:#3399ff;
  --text:#000;
  background:#e8f0ff !important;
}

.light-mode #topBar{
  background:#d7e5ff;
  border-bottom-color:#0066ff;
}

.light-mode #menuBtn,
.light-mode #themeBtn{
  background:#fff;
  border-color:#0066ff;
  color:#0066ff;
}

.light-mode #sideMenu{
  background:#ffffffdd;
  border-right-color:#0066ff;
}

.light-mode #sideMenu a{
  background:#d8e6ff;
  color:#003399;
}

/* POPUP */
#alertBox{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;
}
#alertContent{
  background:rgba(0,0,0,0.85);
  padding:20px;width:80%;max-width:360px;
  border-radius:12px;text-align:center;font-size:18px;
  border:3px solid transparent;
  background-clip:padding-box, border-box;
  background-origin:border-box;
  background-image:
    linear-gradient(#000,#000),
    linear-gradient(45deg, red, orange, yellow, green, cyan, blue, purple);
  animation:borderGlow 3s ease-in-out infinite alternate;
}
#alertContent img{width:80px;height:80px;border-radius:12px;margin-bottom:10px;}
@keyframes borderGlow{
  from{box-shadow:0 0 8px var(--glow);}
  to{box-shadow:0 0 25px var(--glow);}
}
#okBtn{
  margin-top:15px;background:var(--accent);
  padding:10px 22px;border:none;border-radius:8px;
  font-size:16px;font-weight:bold;cursor:pointer;
}

/* SECTIONS */
.section{
  background: rgba(0,0,0,0.65);
  border-radius: 14px;
  padding: 15px;
  margin: 20px 0;
  border: 2px solid rgba(0,255,128,0.3);
  backdrop-filter: blur(6px);
  box-shadow: 0 5px 15px rgba(0,255,128,0.2);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
  margin-top:10px;
}
.card{
  background:rgba(17,26,35,0.85);
  border:2px solid rgba(255,255,255,0.05);
  padding:16px;border-radius:12px;
  display:flex;gap:14px;align-items:center;
  backdrop-filter:blur(6px);
  transition:.25s;cursor:pointer;
}
.card:hover, .card.active{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,255,0,0.4);
  border-color:#00ff00;
}
.icon img{
  width:68px;height:68px;border-radius:50%;object-fit:cover;
}
.btn{
  margin-left:auto;background:var(--accent);
  color:#00332b;padding:8px 14px;border-radius:8px;
  text-decoration:none;font-weight:600;font-size:14px;
}
h1{
  text-align:center;margin-bottom:10px;font-size:22px;font-weight:bold;
  background:linear-gradient(270deg,#FF0000,#FF7F00,#FFFF00,#00FF00,#0000FF,#4B0082,#8B00FF);
  background-size:1400% 1400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rainbow 15s ease infinite;
}
@keyframes rainbow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
</style>
</head>

function render(list,id){

/* THEME */

}

function toggleTheme(){
  document.body.classList.toggle("light-mode");
  if(document.body.classList.contains("light-mode")){
