/* POPUP */

  background-image:
    linear-gradient(#000,#000),

#alertContent img{width:80px;height:80px;border-radius:12px;margin-bottom:10px;}
@keyframes borderGlow{
  from{box-shadow:0 0 8px var(--glow);}
  to{box-shadow:0 0 25px var(--glow);}
}
#okBtn{

  font-size:16px;font-weight:bold;cursor:pointer;

/* SECTIONS */
.section{

  border: 2px solid rgba(0,255,128,0.3);

.grid{

.card{

.card:hover, .card.active{

.icon img{

.btn{

h1{

/* ❄️ TUYẾT */

}
@keyframes fall{

function render(list,id){
  const box=document.getElementById(id);
  list.forEach(a=>{
    let card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="icon"><img src="${a.img}"></div>
      <div class="meta"><h3>${a.name}</h3><p>${a.desc}</p></div>
      <a class="btn" href="${a.link}" target="_blank">Tải</a>`;
    card.onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));card.classList.add('active');};
    box.appendChild(card);
  });
}
render(apps,"appGrid");

/* ❄️ TUYẾT */
function snow(){
  let count = 18;
  for(let i=0;i<count;i++){
    let s = document.createElement("div");
    s.className = "snowflake";
    s.textContent = "❄";
    s.style.left = Math.random()*100 + "vw";
    s.style.fontSize = 10 + Math.random()*10 + "px";
    s.style.opacity = 0.4 + Math.random()*0.5;
    s.style.animationDuration = 5 + Math.random()*7 + "s";
    document.body.appendChild(s);
    setTimeout(()=>{ s.remove(); }, 12000);
  }
}

/* THEME */
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light-mode");
  document.getElementById("themeBtn").textContent="😍";
}

function toggleTheme(){
  document.body.classList.toggle("light-mode");
  if(document.body.classList.contains("light-mode")){
    localStorage.setItem("theme","light");
    themeBtn.textContent="🤩";
  }else{
    localStorage.setItem("theme","dark");
    themeBtn.textContent="😍";
  }
}

/* TYPING EFFECT */
let messages = ["I LOVE YOU ❤️", "TẢI HACK FREE Ở DƯỚI 🤩"];["FREE HACK 🔥"]
let index = 0;
let charIndex = 0;
let deleting = false;
let typingEl = document.getElementById("typingText");

function typeLoop(){
  let current = messages[index];

  if(!deleting){
    typingEl.textContent = current.substring(0, charIndex++);
    if(charIndex > current.length){
      deleting = true;
      setTimeout(typeLoop, 2000);
      return;
    }
  }else{
    typingEl.textContent = current.substring(0, charIndex--);
    if(charIndex < 0){
      deleting = false;
      index = (index + 1) % messages.length;
    }
  }

  setTimeout(typeLoop, deleting ? 50 : 90);
}

typeLoop();
