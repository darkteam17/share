<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KEY TTS - OBI</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family: "SF Pro Display", Arial, sans-serif;
        background:#111;
        background-image:url('https://sf-static.upanhlaylink.com/img/image_20251121040ff21b962a912d0f263f2fdeca9a3a.jpg');
        background-size:cover;
        background-position:center;
    }

    .box{
        width:90%;
        max-width:420px;
        padding:30px;
        background:rgba(0,0,0,0.75);
        border-radius:18px;
        border:1px solid rgba(255,255,255,0.15);
        backdrop-filter:blur(10px);
        box-shadow:0 15px 40px rgba(0,0,0,0.8);
        text-align:center;
    }

    h2{
        color:#00ffbf;
        margin-bottom:16px;
        font-size:24px;
    }

    .keyBox{
        padding:15px;
        background:#00000080;
        border-radius:12px;
        border:1px solid rgba(255,255,255,0.2);
        color:white;
        font-size:18px;
        margin-bottom:20px;
        user-select:all;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:12px;
        background:#00ffbf;
        color:#000;
        font-weight:bold;
        font-size:17px;
        cursor:pointer;
        transition:.25s;
    }

    button.copied{
        background:#2cff72 !important;
    }
</style>
</head>
<body>

<div class="box">
    <h2>KEY FREE TTS</h2>

    <div class="keyBox" id="keyText">KEYFREE-obi74z-9TPQX7MRA2LKJ8WCD1</div>

    <button id="copyBtn" onclick="copyKey()">SAO CHÉP KEY</button>
</div>

<script>
function copyKey(){
    let key = document.getElementById("keyText").innerText;
    let btn = document.getElementById("copyBtn");

    let temp = document.createElement("input");
    temp.value = key;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    document.body.removeChild(temp);

    btn.innerText = "ĐÃ SAO CHÉP";
    btn.classList.add("copied");

    setTimeout(()=>{
        btn.innerText = "SAO CHÉP KEY";
        btn.classList.remove("copied");
    },2000);
}
</script>

</body>
</html>
